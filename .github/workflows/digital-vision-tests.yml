name: Digital Vision regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/**"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit and regression tests
        run: node --test tests/*.test.mjs
