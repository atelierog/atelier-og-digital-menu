bottom:-5px;right:4px;background:white;color:#315c3d;border:1px solid #ddd;border-radius:7px;padding:3px 11px;font-size:10px;font-weight:700}.cartbar{position:sticky;bottom:5px;background:#283c30;color:#fff;border-radius:11px;padding:9px 11px;display:flex;justify-content:space-between;font-size:10px;margin:8px 2px 2px}.orders-grid{grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);align-items:start}.order-card{border:1px solid var(--line);border-radius:13px;padding:14px;background:#1a1d1b;margin-bottom:9px}.order-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.order-top strong{font-size:14px}.order-meta{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin:8px 0}.order-items{padding:9px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;display:flex;justify-content:space-between}.order-actions{display:flex;gap:7px;margin-top:10px}.order-actions .btn{font-size:11px;padding:7px 10px}.detail-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #2a302b;font-size:12px}.detail-line span:last-child{color:var(--muted)}.total{font-weight:700;color:var(--text)!important}.bill-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.bill-row strong{font-size:12px}.bill-row small{display:block;color:var(--muted);font-size:10px}.order-card.selected{border-color:#b5a985}.notice{border:1px solid #574c36;background:#28251e;color:#d9c697;border-radius:11px;padding:11px;font-size:11px;margin-top:12px}.module-grid{grid-template-columns:repeat(3,1fr)}.module{border:1px solid var(--line);border-radius:13px;padding:15px;background:#1a1d1b}.module strong{display:block;margin:6px 0 3px;font-size:13px}.module small{color:var(--muted);font-size:11px}.module .modicon{color:var(--accent);font-size:19px}.modal-wrap{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content: <body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><strong>DIGITAL VISION</strong><small>BY ATELIER OG</small></div>
      <div class="biz"><small>Your restaurant</small><strong>Sun Lise <span class="pill green">Open</span></strong><small style="display:block;margin-top:4px">Manager workspace</small></div>
      <nav>
        <button class="nav active" data-view="overview"><span class="ico">◫</span>Overview</button>
        <button class="nav" data-view="menu"><span class="ico">▤</span>Menu & customer page</button>
        <button class="nav" data-view="orders"><span class="ico">▣</span>Orders & bills <span class="pill gold">4</span></button>
        <button class="nav" data-view="modules"><span class="ico">◇</span>All modules</button>
        <button class="nav" data-view="menu"><span class="ico">▦</span>Tables & QR</button>
        <button class="nav" data-view="modules"><span class="ico">♙</span>Team access</button>
      </nav>
      <div class="side-foot">A simple workspace for your restaurant<br><span style="color:#ddd;margin-top:7px;display:inline-block">Account · Help · Sign out</span></div>
    </aside>
    <main class="main">
      <header class="top"><div class="top-left"><span class="mobile-brand">DIGITAL VISION</span><small>Sun Lise&nbsp; / &nbsp;Manager workspace</small></div><span class="connected">● All changes saved</span></header>
      <section class="page" id="screen"></section>
      <nav class="mobile-nav">
        <button data-view="overview"><span>◫</span>Home</button><button data-view="menu"><span>▤</span>Menu</button><button data-view="orders"><span>▣</span>Orders</button><button data-view="modules"><span>◇</span>More</button>
      </nav>
    </main>
  </div>
  <div class="modal-wrap" id="modal"><div class="modal"><div class="eyebrow">Quick action</div><h2 id="modalTitle">Add a product</h2><p id="modalCopy">The real Manager screen will save this to your restaurant menu.</p><div class="fields"><div class="field"><label>Product name</label><input placeholder="e.g. Garden pasta"></div><div class="field"><label>Price</label><input placeholder="₹ 0.00"></div><div class="field full"><label>Short description</label><textarea placeholder="A short description customers can read"></textarea></div></div><div class="modal-foot"><button class="btn" id="closeModal">Cancel</button><button class="btn primary" id="saveModal">Save example</button></div></div></div>
  <script>
    const screen=document.querySelector('#screen');let view='overview';
    const head=(eyebrow,title,desc,actions='')=>`<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`;
    const btn=(label,cls='')=>`<button class="btn ${cls}" data-action="${label}">${label}</button>`;
    function overview(){screen.innerHTML=head('Sunday · 8 November','Welcome, Rudra','Here’s what’s happening at Sun Lise today.',btn('View customer menu')+btn('+ Add product','primary'))+`<div class="grid stats"><div class="card"><div class="stat-top">Orders today <span class="stat-icon">▣</span></div><div class="stat-value">38</div><div class="stat-note">6 waiting for action</div></div><div class="card"><div class="stat-top">Tables in use <span class="stat-icon">▦</span></div><div class="stat-value">7 <small style="color:var(--muted);font-size:15px">/ 18</small></div><div class="stat-note">11 tables available</div></div><div class="card"><div class="stat-top">Bills to print <span class="stat-icon">▤</span></div><div class="stat-value">4</div><div class="stat-note">Across 3 tables</div></div><div class="card"><div class="stat-top">Sales today <span class="stat-icon">₹</span></div><div class="stat-value">₹18,450</div><div class="stat-note">Example data · reports can download</div></div></div><div class="grid dashgrid"><div class="card"><div class="card-title"><h2>Finish setting up your restaurant</h2><span class="pill gold">3 of 5 done</span></div><div class="checklist"><div class="checkrow done"><span class="checkmark">✓</span><div><strong>Add products to your menu</strong><small>12 items across 4 categories</small></div><button class="mini" data-view="menu">Edit menu →</button></div><div class="checkrow done"><span class="checkmark">✓</span><div><strong>Add your restaurant details</strong><small>Logo and description are ready</small></div><button class="mini" data-view="menu">View page →</button></div><div class="checkrow"><span class="checkmark">3</span><div><strong>Create table QR codes</strong><small>18 tables · codes ready to print</small></div><button class="mini" data-view="menu">Manage tables →</button></div><div class="checkrow"><span class="checkmark">4</span><div><strong>Add your team</strong><small>Order Taker and Bill Counter access</small></div><button class="mini" data-view="modules">Set up team →</button></div></div></div><div class="card"><div class="card-title"><h2>Needs attention</h2><button class="textlink" data-view="orders">Open order desk →</button></div><div class="tablelist"><div class="table-row"><div><strong>New online order · Table 07</strong><small>DV-1048 · 2 items · 2 min ago</small></div><span class="pill gold">New</span><button class="mini" data-view="orders">View →</button></div><div class="table-row"><div><strong>Bill requested · Table 03</strong><small>DV-1041 · ₹540.00</small></div><span class="pill blue">Bill ready</span><button class="mini" data-view="orders">Print →</button></div><div class="table-row"><div><strong>Top ordered today</strong><small>Truffle Mushroom Pasta · 16 orders</small></div><span class="pill green">Popular</span><span></span></div></div><div class="notice">The dashboard shows real counts when connected. This concept preview uses sample restaurant data.</div></div></div><div class="card" style="margin-top:14px"><div class="card-title"><div><h2>Your 9 business modules</h2><small style="color:var(--muted)">Grouped around the work you do every day</small></div><button class="textlink" data-view="modules">View all →</button></div><div class="flow"><span>Catalog · products</span><b>→</b><span>Digital Page · menu</span><b>→</b><span>QR · tables</span><b>→</b><span>Ordering · orders & bills</span><b>→</b><span>Offers · discounts</span><b>→</b><span>Customers · regulars</span><b>→</b><span>Inquiries · questions</span><b>→</b><span>Analytics · reports</span><b>→</b><span>Automation · alerts</span></div></div>`;}
    function menu(){screen.innerHTML=head('Menu & digital page','Build your restaurant page','Add dishes and offers, then preview exactly what guests see.',btn('Tables & QR')+btn('Add product','primary'))+`<div class="tabs"><button class="tab active" data-sub="details">Restaurant details</button><button class="tab" data-sub="products">Products & offers</button><button class="tab" data-sub="preview">Customer preview</button></div><div class="grid builder"><div><div class="card"><div class="card-title"><h2>Restaurant identity</h2><span class="pill green">Draft saved</span></div><div class="fields"><div class="field"><label>Restaurant name</label><input value="Sun Lise"></div><div class="field"><label>Business ID · automatic</label><input value="sun-lise" readonly></div><div class="field full"><label>Short description</label><textarea>Fresh, comforting food made for sharing. Find your favourites and order right from your table.</textarea></div><div class="field"><label>Restaurant logo</label><div class="upload"><span class="fake-logo">S</span><span>Upload logo<br><small>Square image · JPG or PNG</small></span></div></div><div class="field"><label>Menu cover image</label><div class="upload"><span class="cover">COVER IMAGE</span><span>Upload cover<br><small>Wide image · JPG or PNG</small></span></div></div><div class="field full"><label>Customer menu look</label><div class="theme-row"><button class="theme-choice selected">Warm & light</button><button class="theme-choice">Dark & elegant</button><button class="theme-choice">Fresh & minimal</button></div></div></div></div><div class="card" style="margin-top:13px"><div class="card-title"><div><h2>Menu products</h2><small style="color:var(--muted)">Images, short descriptions and clear prices</small></div><button class="textlink" data-action="+ Add product">+ Add</button></div><div class="field"><label>Search products or categories</label><input placeholder="Search menu"></div><div class="product-list"><div class="product"><span class="food" style="background-image:url(https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=180&h=180&fit=crop&auto=format&q=80)">🍝</span><div><strong>Truffle Mushroom Pasta</strong><small>Earthy mushrooms, parmesan, fresh herbs</small></div><em>₹420</em></div><div class="product"><span class="food f2" style="background-image:url(https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=180&h=180&fit=crop&auto=format&q=80)">🥘</span><div><strong>Smoky Paneer Bowl</strong><small>Charred paneer, grains, house dressing</small></div><em>₹360</em></div><div class="product"><span class="food f3" style="background-image:url(https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=180&h=180&fit=crop&auto=format&q=80)">🥗</span><div><strong>Garden Harvest Salad</strong><small>Seasonal greens, citrus vinaigrette</small></div><em>₹290</em></div></div><div class="notice">Offers are set by the Manager and applied automatically at checkout. Customers can review the breakdown, but cannot edit or add a discount.</div></div></div><div class="previewbox"><div class="card-title"><div><h2>Customer view</h2><small style="color:var(--muted)">Live preview · phone and desktop friendly</small></div><button class="textlink" data-sub="preview">Open preview ↗</button></div><div class="phone"><div class="phonebar"><span class="notch"></span></div><div class="restaurant-cover"><div class="restaurant-logo">S</div></div><div class="rest-title"><strong>Sun Lise</strong><small>Restaurant · Table 07 · 20–30 min</small></div><div class="customer-search">⌕ &nbsp;Search dishes, e.g. pasta</div><div class="customer-cats"><span>Popular</span><span>All</span><span>Mains</span><span>Drinks</span></div><div style="padding:3px 5px 6px;font-size:10px;font-weight:700">Most ordered today</div><div class="customer-product"><div><strong>Truffle Mushroom Pasta</strong><p>Earthy mushrooms, parmesan and fresh herbs.</p><b>₹420</b></div><div class="foodphoto" style="background-image:url(https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=300&h=240&fit=crop&auto=format&q=80)">🍝<button class="add">+ Add</button></div></div><div class="customer-product"><div><strong>Smoky Paneer Bowl</strong><p>Charred paneer with our house dressing.</p><b>₹360</b></div><div class="foodphoto" style="background-image:url(https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&h=240&fit=crop&auto=format&q=80)">🥘<button class="add">+ Add</button></div></div><div class="cartbar"><span>2 items · View cart</span><strong>₹780 →</strong></div></div></div></div>`;}
    function orders(){screen.innerHTML=head('Restaurant operations','Orders & bills','A clear hand-off from customer order to waiter and bill counter.',btn('Order Taker view','subtle')+btn('Bill Counter view','primary'))+`<div class="tabs"><button class="tab active" data-order-tab="orders">Orders <span class="pill gold">3 new</span></button><button class="tab" data-order-tab="bills">Bills</button><button class="tab" data-order-tab="history">Completed today</button></div><div class="grid orders-grid"><div><div class="card-title"><h2>New orders</h2><span class="pill green">Live desk · sample view</span></div><article class="order-card selected" id="order1"><div class="order-top"><strong>Table 07 <span class="pill gold">New order</span></strong><strong>₹709.50</strong></div><div class="order-meta"><span>Order DV-1048</span><span>Customer: Maya S.</span><span>2 min ago</span></div><div class="order-items"><span>Truffle Mushroom Pasta × 1<br>Garden Harvest Salad × 1</span><strong>2 items</strong></div><div class="order-actions"><button class="btn primary" data-do="accept">Accept order</button><button class="btn" data-do="reject">Reject</button><button class="btn" data-do="details">View full order</button></div></article><article class="order-card"><div class="order-top"><strong>Table 03 <span class="pill blue">Accepted</span></strong><strong>₹540.00</strong></div><div class="order-meta"><span>Order DV-1041</span><span>Customer: Arjun K.</span><span>8 min ago</span></div><div class="order-items"><span>Smoky Paneer Bowl × 1<br>Fresh Lime Soda × 1</span><strong>2 items</strong></div><div class="order-actions"><button class="btn" data-do="delivered">Mark delivered</button><button class="btn" data-do="details">View full order</button></div></article><article class="order-card"><div class="order-top"><strong>Table 11 <span class="pill green">Delivered</span></strong><strong>₹310.00</strong></div><div class="order-meta"><span>Order DV-1039</span><span>Customer: Neha P.</span><span>12 min ago</span></div><div class="order-items"><span>Garden Harvest Salad × 1</span><strong>1 item</strong></div><div class="order-actions"><button class="btn" data-do="details">View full order</button></div></article></div><div><div class="card"><div class="card-title"><div><h2>Order details</h2><small style="color:var(--muted)">Open an order to see the full information</small></div><span class="pill gold">DV-1048</span></div><div class="detail-line"><strong>Table</strong><span>07</span></div><div class="detail-line"><strong>Customer</strong><span>Maya S.</span></div><div class="detail-line"><strong>Customer ref</strong><span>CU-2481</span></div><div class="detail-line"><span>Truffle Mushroom Pasta × 1</span><span>₹420.00</span></div><div class="detail-line"><span>Garden Harvest Salad × 1</span><span>₹290.00</span></div><div class="detail-line"><span>Offer · automatically applied</span><span>−₹40.00</span></div><div class="detail-line"><span>GST · sample setup</span><span>₹39.50</span></div><div class="detail-line"><strong>Total</strong><span class="total">₹709.50</span></div><div class="notice">The example totals are illustrative. The restaurant owner must configure the applicable taxes and offer rules before orders go live.</div></div><div class="card" style="margin-top:12px"><div class="card-title"><h2>Bill counter · ready to print</h2><span class="pill blue">3 open</span></div><div class="bill-row"><div><strong>Table 07 · DV-1048</strong><small>2 items · ₹709.50 · not paid</small></div><button class="btn primary" data-do="print">Print bill</button></div><div class="bill-row"><div><strong>Table 03 · DV-1041</strong><small>2 items · ₹540.00 · not paid</small></div><button class="btn" data-do="print">Print bill</button></div><div class="bill-row"><div><strong>Table 02 · DV-1037</strong><small>3 items · ₹1,260.00 · not paid</small></div><button class="btn" data-do="print">Print bill</button></div><div class="notice">Printing prepares the itemized bill; it does not record payment or close the table.</div></div></div></div>`;}
    function modules(){const mods=[['▤','Catalog','Products, categories, descriptions and images'],['▣','Ordering','Incoming orders, status and bill desk'],['▦','QR','Table codes and print sheets'],['◉','Digital Page','Restaurant details, theme and live menu'],['✦','Offers','Manager-created automatic discounts'],['♙','Customers','Customer details and order history'],['⌕','Inquiries','Customer questions and requests'],['▥','Analytics','Sales, bill and popular-item reports'],['⚙','Automation','In-app alerts and routine actions']];screen.innerHTML=head('Your workspace','All business modules','Every enabled module should open a useful, business-scoped tool.',btn('Back to overview','primary'))+`<div class="grid module-grid">${mods.map(m=>`<div class="module"><span class="modicon">${m[0]}</span><strong>${m[1]}</strong><small>${m[2]}</small><div style="margin-top:13px"><span class="pill green">Enabled</span> <button class="textlink" data-view="${m[1]==='Ordering'?'orders':'menu'}">Open →</button></div></div>`).join('')}</div><div class="notice">This is a design preview with sample data. On the live system, modules are shown and opened according to the Super Admin’s entitlements.</div>`;}
    function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));({overview,menu,orders,modules}[view]||overview)();}
    document.addEventListener('click',e=>{const v=e.target.closest('[data-view]')?.dataset.view;if(v){view=v;render();window.scrollTo(0,0);return}const action=e.target.closest('[data-action]')?.dataset.action;if(action){const m=document.querySelector('#modal');document.querySelector('#modalTitle').textContent=action==='+ Add product'?'Add a product':'Customer menu preview';document.querySelector('#modalCopy').textContent=action==='+ Add product'?'The Manager adds the product name, price, description and a photo.':'This preview opens the exact restaurant page customers see after scanning a table QR.';m.classList.add('show');return}if(e.target.id==='closeModal'||e.target.id==='saveModal'||e.target.id==='modal')document.querySelector('#modal').classList.remove('show');const sub=e.target.closest('[data-sub]')?.dataset.sub;if(sub){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.sub===sub));return}const d=e.target.closest('[data-do]')?.dataset.do;if(d){if(d==='details')return;if(d==='print'){window.print();return}const card=e.target.closest('.order-card');const label=d==='accept'?'Accepted':d==='reject'?'Rejected':'Delivered';card.querySelector('.order-top .pill').textContent=label;card.querySelector('.order-top .pill').className='pill '+(label==='Accepted'?'blue':label==='Delivered'?'green':'gold');if(d==='reject')card.style.opacity='.6';if(d==='accept'){const b=e.target;b.textContent='Accepted';b.disabled=true}if(d==='delivered'){e.target.textContent='Delivered';e.target.disabled=true}}});
    render();
